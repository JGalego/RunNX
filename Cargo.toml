[package]
name = "runnx"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "A minimal, verifiable ONNX runtime implementation in Rust"
authors = ["João Galego <jgalego1990@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/JGalego/runnx"
readme = "README.md"
keywords = ["onnx", "machine-learning", "neural-network", "runtime", "inference"]
categories = ["science", "mathematics", "algorithms"]
include = [
    "src/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "third_party/onnx/onnx/onnx.proto",
]

[dependencies]
# Core dependencies
ndarray = { version = "0.16", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
prost = "0.14.1"
log = "0.4"
# env_logger is a concrete logger implementation required by the runnx-runner binary.
# Library users should bring their own logger; the library itself only uses `log`.
env_logger = "0.11"

# Optional features
tokio = { version = "1.0", features = ["full"], optional = true }
rayon = { version = "1.10", optional = true }
wide = "0.7"
cblas = { version = "0.4", optional = true }
blas-src = { version = "0.10", features = ["openblas"], optional = true }
openblas-src = { version = "0.10", features = ["system"], optional = true }

[build-dependencies]
prost-build = "0.14.1"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
tempfile = "3.8"
tokio = { version = "1.0", features = ["macros", "rt"] }
proptest = "1.4"
# Image processing — only used by examples and benchmarks, not the library.
# Pinned to 0.25.5 for MSRV 1.85 compatibility (0.25.6+ requires Rust 1.87).
image = "=0.25.5"
imageproc = "0.25"

# Note: For code coverage, run `./scripts/coverage.sh` to exclude auto-generated files

[features]
default = []
async = ["tokio"]
parallel = ["rayon"]
naive-conv = []            # Nested-loop Conv (educational reference; slowest)
blas = ["dep:cblas", "dep:blas-src", "dep:openblas-src"]  # im2col + OpenBLAS sgemm (fastest; requires libopenblas-dev)
formal-verification = []  # Enable formal verification checks and contracts

[[bench]]
name = "inference_benchmark"
harness = false

[[bench]]
name = "operator_benchmark"
harness = false

[[bench]]
name = "cv_benchmark"
harness = false

[lib]
name = "runnx"
path = "src/lib.rs"

[[bin]]
name = "runnx-runner"
path = "src/bin/runner.rs"

[[example]]
name = "simple_model"
path = "examples/simple_model.rs"

[[example]]
name = "logistic_regression"
path = "examples/logistic_regression.rs"
