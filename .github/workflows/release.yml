name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Protocol Buffers compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libopenblas-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Validate release metadata and provenance
      shell: bash
      run: |
        set -euo pipefail
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"

        test "$TAG_VERSION" = "$MANIFEST_VERSION" || {
          echo "Tag version $TAG_VERSION does not match Cargo.toml version $MANIFEST_VERSION"
          exit 1
        }
        grep -Fq "## [$TAG_VERSION] -" CHANGELOG.md || {
          echo "CHANGELOG.md has no entry for $TAG_VERSION"
          exit 1
        }
        test -s "RELEASE_NOTES_${TAG_VERSION}.md" || {
          echo "RELEASE_NOTES_${TAG_VERSION}.md is missing or empty"
          exit 1
        }

        git fetch origin main
        git merge-base --is-ancestor HEAD origin/main || {
          echo "Release tag must point to a commit on the stable main branch"
          exit 1
        }

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all-features

    - name: Build documentation
      run: cargo doc --all-features --no-deps

    - name: Build release artifacts
      run: cargo build --release --all-features

    - name: Verify publish package
      run: cargo publish --dry-run

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Protocol Buffers compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # Ensure we get the full history for proper release notes
        fetch-depth: 0
        # Ensure clean checkout
        clean: true

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binaries
      run: |
        # Clean any previous builds to avoid conflicts
        cargo clean
        # Build with explicit target for consistency
        cargo build --release --bin runnx-runner
        # Verify the binary was created
        ls -la target/release/runnx-runner
        
    - name: Create release archive
      run: |
        mkdir -p artifacts
        # Copy binary
        cp target/release/runnx-runner artifacts/
        # Copy documentation and licenses
        cp README.md LICENSE-MIT LICENSE-APACHE artifacts/
        # Create archive from the artifacts directory only
        cd artifacts
        tar -czf ../runnx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz *
        cd ..
        mv runnx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz artifacts/
        
    - name: Verify release archive
      run: |
        # List archive contents to verify
        echo "Archive contents:"
        tar -tzf artifacts/runnx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
        # Check archive size
        ls -lh artifacts/runnx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

    - name: Resolve release version
      id: release-version
      shell: bash
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: RunNX ${{ github.ref_name }}
        body_path: RELEASE_NOTES_${{ steps.release-version.outputs.version }}.md
        files: artifacts/runnx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
